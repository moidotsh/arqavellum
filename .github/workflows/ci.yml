# CI — the "deferred to CI" leg of the local quality gate. The pre-commit
# hook stays fast (audits + tsc + structural eslint); this workflow adds
# the full vitest suite on every push to main and every pull request.
# Bun only (invariant 1) — no package-lock.json / yarn.lock exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Structural audits (13-audit gate + structural ESLint)
        run: bun run lint:structure

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test:run
